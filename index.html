<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE AI Fitness Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <header class="navbar">
      <div class="logo">⚡ PULSE AI</div>
      <nav class="nav-links">
        <a href="#dashboard" class="nav-btn active">Dashboard</a>
        <a href="#workouts" class="nav-btn">Workouts</a>
        <a href="#analytics" class="nav-btn">Analytics</a>
        <a href="#coach" class="nav-btn">AI Coach</a>
      </nav>
    </header>

    <main class="container">
      <div class="section-grid">
        <div class="card">
          <h3 class="card-title">Calories Burned</h3>
          <div class="card-value" id="totalCal">630 kcal</div>
        </div>
        <div class="card">
          <h3 class="card-title">Total Active Time</h3>
          <div class="card-value" id="totalTime">75 mins</div>
        </div>
      </div>

      <div class="main-grid">
        <div>
          <div class="box">
            <div class="box-title">Recent Activity Logs</div>
            <div id="workoutList" class="list-container">
              <!-- Dynamically populated from API -->
            </div>
          </div>
        </div>

        <div>
          <div class="box">
            <div class="box-title">Log New Activity</div>
            <form id="workoutForm">
              <div class="form-group">
                <label>Workout Name</label>
                <input type="text" id="wName" class="form-control" placeholder="Chest & Triceps" required>
              </div>
              <div class="form-group">
                <label>Duration (mins)</label>
                <input type="number" id="wDuration" class="form-control" placeholder="45" required>
              </div>
              <div class="form-group">
                <label>Calories</label>
                <input type="number" id="wCalories" class="form-control" placeholder="300" required>
              </div>
              <button type="submit" class="btn btn-block">Add Workout</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
