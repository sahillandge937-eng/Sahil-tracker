<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PULSE — AI Fitness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="errorBanner" class="banner" hidden></div>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span> PULSE</div>
    <nav class="nav-group" id="navGroup"><!-- populated by app.js --></nav>
    <div class="sidebar-footer">PULSE AI Fitness Tracker &middot; local & private</div>
  </aside>

  <div class="main">
    <div class="mobile-topbar">
      <button id="menuToggle" aria-label="Toggle menu">☰</button>
      <strong>PULSE</strong>
    </div>

    <div class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="date" id="pageDate"></div>
      </div>
      <div class="topbar-right" id="topbarActions"></div>
    </div>

    <main class="content" id="content">
      <div class="empty">Loading PULSE…</div>
    </main>
  </div>

</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/forms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
