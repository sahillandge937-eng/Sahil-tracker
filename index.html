<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0f0d;
      --card-bg: #161a17;
      --card-border: #222924;
      --text-main: #f1f5f2;
      --text-muted: #8b968f;
      --green-accent: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

    /* Top Header */
    header {
      background: #111512;
      border-bottom: 1px solid var(--card-border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .menu-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .brand {
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card-icon { font-size: 1.2rem; }
    .card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .card-sub {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 14px;
    }

    .select-input {
      width: 100%;
      background: #111512;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 8px;
    }

    /* Weekly Card Inner Box */
    .week-box {
      background: #111512;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
    }
    .week-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .week-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .week-stats {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <button class="menu-btn">☰</button>
    <div class="brand">PULSE</div>
  </header>

  <main class="container">

    <!-- Fitness History Selector -->
    <div class="card">
      <div class="card-title-row">
        <span class="card-icon">📅</span>
        <span class="card-title">Fitness History</span>
      </div>
      <div class="card-sub">View your daily and weekly fitness data for any month.</div>
      <select class="select-input" id="monthSelect">
        <option value="2026-10">October 2026</option>
        <option value="2026-09">September 2026</option>
        <option value="2026-08">August 2026</option>
      </select>
    </div>

    <!-- Workouts Count -->
    <div class="card">
      <div class="card-title-row">
        <span class="card-icon">🏋️</span>
        <span class="card-title">Workouts</span>
      </div>
      <div class="stat-number" id="workoutCount">0</div>
    </div>

    <!-- Workout Calories -->
    <div class="card">
      <div class="card-title-row">
        <span class="card-icon">🔥</span>
        <span class="card-title">Workout Calories</span>
      </div>
      <div class="stat-number" id="workoutCal">0</div>
    </div>

    <!-- Workout Minutes -->
    <div class="card">
      <div class="card-title-row">
        <span class="card-icon">⏱️</span>
        <span class="card-title">Workout Minutes</span>
      </div>
      <div class="stat-number" id="workoutMin">0</div>
    </div>

    <!-- Nutrition Calories -->
    <div class="card">
      <div class="card-title-row">
        <span class="card-icon">🍽️</span>
        <span class="card-title">Nutrition Calories</span>
      </div>
      <div class="stat-number" id="nutritionCal">0</div>
    </div>

    <!-- Weekly Monday-Sunday -->
    <div class="card">
      <div class="card-title-row">
        <span class="card-icon">📅</span>
        <span class="card-title">Weekly Monday–Sunday</span>
      </div>
      <div class="week-box">
        <div class="week-header">
          <span>Week 1</span>
          <div class="week-stats">
            <span>🏋️ 0 workouts</span>
            <span>🔥 0 kcal</span>
          </div>
        </div>
        <div class="week-meta">9/28/2026 – 10/4/2026</div>
      </div>
    </div>

  </main>

</body>
</html>
