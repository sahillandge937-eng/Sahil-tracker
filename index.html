<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE AI Fitness Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #111827;
      --accent: #10b981;
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
      --border: #1f2937;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }
    .navbar { background: #111827; border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.4rem; font-weight: bold; color: var(--accent); }
    .nav-links { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 5px; }
    .nav-links a { color: var(--text-sub); text-decoration: none; font-size: 0.9rem; white-space: nowrap; transition: 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card h3 { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 8px; }
    .card .val { font-size: 1.8rem; font-weight: bold; color: var(--text-main); }
    .chart-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 20px; }
    .btn { background: var(--accent); color: #000; border: none; padding: 10px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="app">
    <header class="navbar">
      <div class="logo">⚡ PULSE AI</div>
      <nav class="nav-links">
        <a href="#dashboard" class="active">Dashboard</a>
        <a href="#workouts">Workouts</a>
        <a href="#exercises">Exercises</a>
        <a href="#analytics">Analytics</a>
        <a href="#profile">Profile</a>
      </nav>
    </header>

    <main id="content" class="container">
      <div class="grid">
        <div class="card">
          <h3>DAILY CALORIES</h3>
          <div class="val">2,140 kcal</div>
        </div>
        <div class="card">
          <h3>WORKOUT TIME</h3>
          <div class="val">48 mins</div>
        </div>
        <div class="card">
          <h3>STEPS COUNT</h3>
          <div class="val">8,420</div>
        </div>
        <div class="card">
          <h3>AI FITNESS SCORE</h3>
          <div class="val" style="color: var(--accent);">92 / 100</div>
        </div>
      </div>

      <div class="chart-box">
        <h3 style="margin-bottom: 15px; color: var(--text-sub);">Weekly Activity Progress</h3>
        <canvas id="fitnessChart" height="100"></canvas>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const ctx = document.getElementById('fitnessChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
          datasets: [{
            label: 'Calories Burned',
            data: [420, 550, 380, 600, 500, 720, 450],
            backgroundColor: '#10b981',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: { beginAtZero: true, grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } },
            x: { grid: { display: false }, ticks: { color: '#9ca3af' } }
          },
          plugins: { legend: { labels: { color: '#f9fafb' } } }
        }
      });
    });
  </script>
</body>
</html>
