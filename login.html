<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      padding: 30px;
      border-radius: 20px;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      background: #334155;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: #94a3b8;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #f87171;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #cbd5e1;
    }

    .register a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">PULSE</div>

    <div class="subtitle">
      AI Fitness Tracker
    </div>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      >

      <button type="submit">Login</button>

    </form>

    <div class="message" id="message"></div>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (email && password) {
        message.style.color = "#4ade80";
        message.textContent = "Login details received!";
      } else {
        message.textContent = "Please enter email and password.";
      }
    });
  </script>

</body>
</html>
